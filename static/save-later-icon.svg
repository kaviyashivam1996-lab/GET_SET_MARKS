<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Drop Shadow Filter -->
    <filter id="badge-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Bevel / Inner Shadow Filter -->
    <filter id="inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="white" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Button Disc Gradients -->
    <linearGradient id="disc-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <radialGradient id="disc-body-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="88%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Bookmark Icon Gradient & Shadow -->
    <filter id="ribbon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Shadow & Beveled Rim -->
  <circle cx="256" cy="256" r="216" fill="url(#disc-rim-grad)" filter="url(#badge-shadow)" />

  <!-- Disc Bevel Ring -->
  <circle cx="256" cy="256" r="208" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />

  <!-- Main Glossy Disc Surface -->
  <circle cx="256" cy="256" r="198" fill="url(#disc-body-grad)" />

  <!-- Subtle Top Light Reflection -->
  <ellipse cx="256" cy="96" rx="140" ry="24" fill="white" opacity="0.35" />

  <!-- Bookmark Ribbon Icon -->
  <g filter="url(#ribbon-shadow)">
    <!-- Main Ribbon Shape Outline -->
    <path d="M190 148 C190 142 194 138 200 138 L312 138 C318 138 322 142 322 148 L322 364 C322 371 314 375 308 370 L256 324 L204 370 C198 375 190 371 190 364 Z" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="15" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Top Divider/Accent Stitch Line -->
    <line x1="202" y1="184" x2="310" y2="184" 
          stroke="#0f172a" 
          stroke-width="11" 
          stroke-linecap="round" />
  </g>
</svg>
